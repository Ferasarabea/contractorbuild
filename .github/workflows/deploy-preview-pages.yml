name: Deploy visual preview to GitHub Pages

on:
  push:
    branches: [main, work]
    paths:
      - index.html
      - services/**
      - industries/**
      - wp-content/**
      - scripts/**
      - .github/workflows/deploy-preview-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build complete static inspection site
        run: |
          chmod +x scripts/*.sh scripts/*.py
          ./scripts/export-site.sh
          mkdir -p _site
          cp index.html _site/index.html
          cp -r services industries about accessibility contact free-marketing-audit privacy-policy resources results terms _site/
          mkdir -p _site/wp-content/themes/contractor-build/assets/js
          cp wp-content/themes/contractor-build/style.css _site/wp-content/themes/contractor-build/style.css
          cp wp-content/themes/contractor-build/assets/js/site.js _site/wp-content/themes/contractor-build/assets/js/site.js
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
